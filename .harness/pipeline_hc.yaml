pipeline:
  name: dotnet-client-repo hc
  identifier: dotnetclientrepo_hc
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: dotnet-client
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
            override: true
          platform:
            os: Windows
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Setup NET SDK
                  identifier: Setup_NET_SDK
                  spec:
                    shell: Powershell
                    command: |-
                      # Install .NET SDK (adjust version as needed)
                      Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
                      .\dotnet-install.ps1 -Channel 9.0 -InstallDir "C:\dotnet"
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet --version
                      nuget install redis-64 -excludeversion -source http://www.nuget.org/api/v2/
                      Redis-64\tools\redis-server.exe --service-install
                      Redis-64\tools\redis-server.exe --service-start
              - step:
                  type: Run
                  name: Restore Dependencies
                  identifier: Restore_Dependencies
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet restore
              - step:
                  type: Run
                  name: Build
                  identifier: Build
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet build --configuration Release --no-restore
              - step:
                  type: Run
                  name: Run tests with coverage
                  identifier: Run_tests_with_coverage
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet test .\tests\Splitio-tests\Splitio-tests.csproj `
                        -c Release `
                        -f net9.0 `
                        --no-build `
                        --collect:"XPlat Code Coverage" `
                        --results-directory:"./TestResults" `
                        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura
                      $report = Get-ChildItem -Path .\TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
                      if (-not $report) { throw "coverage.cobertura.xml was not produced" }
                      New-Item -ItemType Directory -Force -Path .\coverage | Out-Null
                      Copy-Item $report.FullName .\coverage\coverage.cobertura.xml -Force
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverageWindows
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage/coverage.cobertura.xml"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/bin/**,**/obj/**,**/*Test*.cs,**/*Tests.cs"
              - parallel:
                  - step:
                      type: Run
                      name: Run Other Tests Net 9
                      identifier: Run_Other_Tests_Net_9
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.Integration-tests\Splitio.Integration-tests.csproj -f net9.0 -c Release --no-build
                          #dotnet test .\tests\Splitio.Integration-events-tests\Splitio.Integration-events-tests.csproj -f net9.0 -c Release --no-build
                          #dotnet test .\tests\Splitio.Integration-redis-tests\Splitio.Integration-redis-tests.csproj -f net9.0 -c Release --no-build
                          #dotnet test .\tests\Splitio.TestSupport\Splitio.TestSupport.csproj -c Release -f net9.0 --no-build
                  - step:
                      type: Run
                      name: Run other tests Net9 - 2
                      identifier: Run_other_tests_Net9_2
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.Integration-events-tests\Splitio.Integration-events-tests.csproj -f net9.0 -c Release --no-build
                  - step:
                      type: Run
                      name: Run Other tests Net 9 - 3
                      identifier: Run_Other_tests_Net_9_3
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.Integration-redis-tests\Splitio.Integration-redis-tests.csproj -f net9.0 -c Release --no-build
                  - step:
                      type: Run
                      name: Run Other Tests Net 9 - 4
                      identifier: Run_Other_Tests_Net_9_4
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.TestSupport\Splitio.TestSupport.csproj -c Release -f net9.0 --no-build
              - parallel:
                  - step:
                      type: Run
                      name: Run tests Net 472
                      identifier: Run_unit_tests_Net_8
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.Integration-tests\Splitio.Integration-tests.csproj -f net472 -c Release --no-build
                    contextType: Pipeline
                  - step:
                      type: Run
                      name: Run tests Net 472 - 2
                      identifier: Run_tests_Net_472_2
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.Integration-events-tests\Splitio.Integration-events-tests.csproj -f net472 -c Release --no-build
                  - step:
                      type: Run
                      name: Run tests Net 472 - 3
                      identifier: Run_tests_Net_472_3
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.Integration-redis-tests\Splitio.Integration-redis-tests.csproj -f net472 -c Release --no-build
                  - step:
                      type: Run
                      name: Run tests Net 472 - 4
                      identifier: Run_tests_Net_472_4
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio.TestSupport\Splitio.TestSupport.csproj -c Release -f net472 --no-build
                  - step:
                      type: Run
                      name: Run tests Net 472 - 5
                      identifier: Run_tests_Net_472_5
                      spec:
                        shell: Powershell
                        command: |-
                          $env:PATH = "C:\dotnet;$env:PATH"
                          dotnet test .\tests\Splitio-tests\Splitio-tests.csproj -f net472 -c Release --no-build
              - step:
                  type: Run
                  name: Create Nuget
                  identifier: Create_Nuget
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      if (!(Test-Path ".\nuget")) { mkdir .\nuget }
                      dotnet pack .\src\Splitio --configuration Release --output .\nuget
                      dotnet pack .\Splitio.Redis --configuration Release --output .\nuget
              - step:
                  type: Run
                  name: Upload Nuget
                  identifier: Upload_Nuget
                  spec:
                    shell: Powershell
                    command: |-
                      $env:PATH = "C:\dotnet;$env:PATH"
                      dotnet nuget push '.\nuget\*.nupkg' -k $Env:API_KEY -s 'https://harness0.harness.io/pkg/l7B_kbSEQD2wjrM7PShm5w/fme-nuget/nuget/'
                    envVariables:
                      API_KEY: <+secrets.getValue("harness-ci-nuget-token")>
